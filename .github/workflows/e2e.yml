name: e2e

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compose stack deps
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/ready && curl -fsS -o /dev/null http://127.0.0.1/login && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Wait for demo CVE seed
        run: |
          for i in $(seq 1 36); do
            # anonymous search is 401; login then search
            TOK=$(curl -fsS -X POST http://127.0.0.1:8000/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"ChangeMe_StrongPass_123!","device_label":"ci"}' \
              | python -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
            if [[ -n "$TOK" ]]; then
              HIT=$(curl -fsS "http://127.0.0.1:8000/search?q=CVE-2024-0001" \
                -H "Authorization: Bearer $TOK" \
                | python -c 'import sys,json; d=json.load(sys.stdin); print(any(h.get("id")=="CVE-2024-0001" for h in d.get("results",[])))')
              if [[ "$HIT" == "True" ]]; then
                echo "demo CVE present"
                exit 0
              fi
            fi
            sleep 5
          done
          docker compose logs --tail=80 api
          exit 1
      - name: API unit tests
        run: |
          cd apps/api
          pip install -r requirements.txt
          pytest -q
      - name: Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          VBX_E2E_BASE_URL: http://127.0.0.1:80
          VBX_E2E_USER: admin
          VBX_E2E_PASSWORD: ChangeMe_StrongPass_123!
      - name: Validate install script syntax
        run: |
          bash -n deploy/redos/install.sh
          bash -n deploy/redos/validate-install.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          COMPOSE_DIR=$PWD bash deploy/redos/validate-install.sh
